[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-engine-v1"
version = "0.1.0"
description = "Zone-based trading engine with context and plan generation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]
integration = [
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "kafka-python>=2.0.2",
  "websockets>=12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
